<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF6B00" stroke-opacity=".08"/>
    </pattern>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0" stop-color="#FF6B00" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <text x="50%" y="52%" font-family="Montserrat, Arial, sans-serif"
        font-weight="800" font-size="56" fill="#FF6B00" fill-opacity=".9"
        text-anchor="middle" letter-spacing="-1">MARTX</text>
  <text x="50%" y="62%" font-family="JetBrains Mono, monospace"
        font-size="16" fill="#888" text-anchor="middle"
        letter-spacing="3">PLACEHOLDER</text>
</svg>